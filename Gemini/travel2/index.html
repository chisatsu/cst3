<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>大分旅行記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* タイトル */
    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #777;
    }

    /* タイムライン */
    .timeline {
      position: relative;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 48px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ddd;
    }

    /* 旅行スポット */
    .spot {
      position: relative;
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 20px;
      margin-bottom: 35px;
    }

    /* 時刻 */
    .time {
      font-size: 16px;
      font-weight: bold;
      text-align: right;
      padding-top: 5px;
      color: #555;
    }

    /* 丸いポイント */
    .spot::before {
      content: "";
      position: absolute;
      left: 42px;
      top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      border: 3px solid #555;
      z-index: 1;
    }

    /* カード */
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .photo {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 20px;
    }

    .content h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 18px;
      line-height: 1.7;
      color: #666;
    }

    /* Google Mapsボタン */
    .map-button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #333;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .map-button:hover {
      opacity: 0.8;
    }

    /* スマホ */
    @media (max-width: 600px) {

      .container {
        padding: 25px 12px;
      }

      .header h1 {
        font-size: 25px;
      }

      .spot {
        grid-template-columns: 55px 1fr;
        gap: 15px;
      }

      .timeline::before {
        left: 38px;
      }

      .spot::before {
        left: 32px;
      }

      .time {
        font-size: 14px;
      }

      .photo {
        height: 190px;
      }

      .content {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- タイトル -->
    <header class="header">
      <h1>大分旅行記</h1>
      <p>2026年5月　Day 1</p>
    </header>

    <!-- タイムライン -->
    <main class="timeline" id="timeline">
    </main>

  </div>


  <script>

    /*
     * ========================================
     * 旅行データ
     * ========================================
     *
     * ここを書き換えるだけで旅行記を変更できます。
     *
     * placeIdにはGoogle MapsのPlace IDを入れます。
     */

    const trip = [

      {
        time: "08:10",
        name: "大阪駅",
        description: "大阪を出発。ここから大分へ向かいます。",
        placeId: "ChIJxxxxxxxxxxxxxxxx"
      },

      {
        time: "12:35",
        name: "別府地獄めぐり",
        description: "別府に到着。まずは有名な地獄めぐりへ。",
        placeId: "ChIJxxxxxxxxxxxxxxxx"
      },

      {
        time: "15:20",
        name: "海地獄",
        description: "青く美しい海地獄。思っていたよりもかなり大きかった。",
        placeId: "ChIJxxxxxxxxxxxxxxxx"
      },

      {
        time: "17:30",
        name: "別府温泉",
        description: "今日の宿に到着。温泉に入って一日の疲れを癒します。",
        placeId: "ChIJxxxxxxxxxxxxxxxx"
      }

    ];


    /*
     * ========================================
     * 旅行記を画面に表示
     * ========================================
     */

    const timeline = document.getElementById("timeline");

    trip.forEach((spot, index) => {

      /*
       * Google MapsのPlace IDから
       * Google Mapsのページを開くURLを作る
       */
      const mapUrl =
        `https://www.google.com/maps/search/?api=1&query=Google&query_place_id=${spot.placeId}`;


      /*
       * 現在はサンプル画像。
       *
       * 将来的にはここを
       * Google Places APIから取得した
       * 写真URLに置き換える。
       */
      const imageUrl =
        `https://picsum.photos/800/500?random=${index + 10}`;


      const element = document.createElement("article");

      element.className = "spot";

      element.innerHTML = `

        <div class="time">
          ${spot.time}
        </div>

        <div class="card">

          <img
            class="photo"
            src="${imageUrl}"
            alt="${spot.name}"
          >

          <div class="content">

            <h2>${spot.name}</h2>

            <p class="description">
              ${spot.description}
            </p>

            <a
              class="map-button"
              href="${mapUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Googleマップで見る
            </a>

          </div>

        </div>

      `;

      timeline.appendChild(element);

    });

  </script>

</body>
</html>
